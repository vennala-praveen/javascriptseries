<body>
    <h2>Closure</h2>

    <input type="button" onclick="updatecount()" value="click">
    <p id="count">cliked:0</p>

    //accessing variable of a function even its execution completes or out of its scope
    <script>
        // function outer(){

        //     function inner(){
        //         var y = 100
        //         console.log(x)
        //     }

        //     return inner
        // }

        // var res= outer();

        function updateCountSecure(){
            let count = 0;

            function inner(){
                count = count + 1;
                let p = document.getElementById('count')
                p.innerText = `clicked:${count}`
            }

            return inner
        }

        let updatecount = updateCountSecure()
        console.log(updatecount)
    </script>
