<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objects</title>
</head>
<body>
    <h1>Objects in JS</h1>

    <script>
        let movie = {name: "BB2", release: 2020, director: "Rajmouli"};
        console.log(movie);

        movie["release"] = 2018;
        console.log(movie);

        movie.budget = "500 crores";
        console.log(movie);
    </script>
</body>
</html>
