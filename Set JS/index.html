<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set in JS</title>
</head>
<body>
    <h1>Set in JS</h1>

     <!-- set: collection of unique values
     array: collection of values -->

    <script>
        let p1 = new Set();
        p1.add(20)
        console.log(p1);

        a1 = [20,30,30,40,60,70,88,70,90];
        console.log(a1);

        let s1 = new Set(a1);
        console.log(s1);

        let s2 = "Visakhapatnam";
        let s3 = new Set(s2);
        console.log(s3)

        
    </script>
</body>
</html>
