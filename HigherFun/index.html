    // square(arr)

    function square(num){
        return num * num;
    }

    function cube(num){
        return num * num * num;
    }

    function incr(num){
        return num + 1;
    }

    function anyopr(arr, opr){
        let result = []
        for(ele of arr){
        let temp = opr(ele)
            result.push(temp)
            
        }
        return result
        
    }

    let x = anyopr(arr,incr)
    console.log(x);

    let y = anyopr(arr,square)
    console.log(y);

    let z = anyopr(arr,cube)
    console.log(z);
