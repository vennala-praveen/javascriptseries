<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation</title>
</head>
<body>
    <h1>DOM Manipulation in JS</h1>

    <div id="first">
        <p>This is first paragraph in div1</p>
        <p>This is second paragraph in div1</p>
    </div>

    <div id="second">
        <p>This is first paragraph in div2</p>
        <p>This is second paragraph in div2</p>
    </div>

    <script>
        var n = document.createElement('h1');
        n.innerText = "This is third paragraph in div2";
        console.log(n);

        var parent = document.getElementById("second");
        console.log(parent);

        parent.appendChild(n);

        console.log(parent.innerText);
        console.log(parent.innerHTML);
    </script>
</body>
</html>
