<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reduce Method</title>
</head>
<body>
    <h2>Reduce Method</h2>

    <script>

        var arr = [23,43,5,7,4,7];

        var max = arr.reduce(function(acc,ele){
            if(acc > ele){
                return acc;
            }else{
                return ele;
            }
        }, arr[0]);

        console.log(max);
    </script>
</body>
</html>
