<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Method</title>
</head>
<body>
    <h2>Filter Method</h2>

    <script>
        var num = [2,45,88,28,40,6];

        var even = num.filter(function(ele){
            return ele%2 == 0;
        })

        console.log(num);
        console.log(even);
    </script>
</body>
</html>
