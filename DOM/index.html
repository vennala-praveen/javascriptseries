<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    <h1>DOM in JS</h1>

    <h2 id="demo">Hi! Tony Stark</h2>

    <script>
        let x = document.getElementById("demo");
        console.log(x); 
    </script>

        <div class="demo1">
            <h1>Hi! Tony Stark</h1>
            <p>Welcome to JS class</p>
        </div>

        <script>
            let y = document.getElementsByClassName("demo1");
            console.log(y);
        </script>
</body>
</html>
