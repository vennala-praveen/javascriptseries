<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events in JS</title>
    <style>
        #special{
            position: absolute;
            top: 45%;
            left: 50%;
        }
        .head{
            color: green;
            text-align: center;
        }
        #b1{
            border-radius: 4px;
            background-color: blue;
            padding: 20px;
            
        }
    </style>
</head>
<body>
    <div id="special">
    <h3 class="head">Events in JS</h3>
    <button id="b1">Change Color</button>
    </div>

    <script>
        let btn = document.getElementById('b1')
        // btn.onclick = function(){document.body.style.backgroundColor="Blue"};
        btn.addEventListener('click',change);
        function change(){
            document.body.style.backgroundColor = 'Green';
        }
    </script>
</body>
</html>
